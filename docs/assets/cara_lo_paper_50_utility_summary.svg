<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">CARA lead-optimisation 50-card utility summary</title>
  <desc id="desc">Readable bar chart comparing feasible utility for the oracle, QSAR baselines, guarded LLM systems, and similarity baseline. All shown rows have compliance 1.000.</desc>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#111827">CARA lead-optimisation audit: utility at full compliance</text>
  <text x="40" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#4b5563">50 cards, k=10. Feasible utility is higher when selected candidates recover more hidden retrospective activity.</text>
  <text x="40" y="104" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#6b7280">Rows shown here all have compliance = 1.000; validator-repaired LLM rows are guarded systems, not raw model behavior.</text>

  <line x1="360" y1="128" x2="360" y2="474" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="494" y1="128" x2="494" y2="474" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="628" y1="128" x2="628" y2="474" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="762" y1="128" x2="762" y2="474" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="896" y1="128" x2="896" y2="474" stroke="#f3f4f6" stroke-width="1"/>

  <text x="360" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#6b7280">60</text>
  <text x="494" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#6b7280">70</text>
  <text x="628" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#6b7280">80</text>
  <text x="762" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#6b7280">90</text>
  <text x="896" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#6b7280">100</text>
  <text x="628" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="13" fill="#4b5563">Feasible utility</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="154">Oracle upper-bound</text>
    <rect x="360" y="136" width="389" height="28" rx="4" fill="#111827"/>
    <text x="764" y="156" font-weight="700">89.022</text>
    <text x="842" y="156" fill="#4b5563">NDCG 1.000</text>

    <text x="40" y="202">QSAR linear SVR</text>
    <rect x="360" y="184" width="286" height="28" rx="4" fill="#2563eb"/>
    <text x="661" y="204" font-weight="700">81.382</text>
    <text x="739" y="204" fill="#4b5563">NDCG 0.910</text>

    <text x="40" y="250">QSAR gradient boosting</text>
    <rect x="360" y="232" width="280" height="28" rx="4" fill="#3b82f6"/>
    <text x="655" y="252" font-weight="700">80.888</text>
    <text x="733" y="252" fill="#4b5563">NDCG 0.900</text>

    <text x="40" y="298">QSAR random forest</text>
    <rect x="360" y="280" width="276" height="28" rx="4" fill="#60a5fa"/>
    <text x="651" y="300" font-weight="700">80.634</text>
    <text x="729" y="300" fill="#4b5563">NDCG 0.901</text>

    <text x="40" y="346">LLM + validator, Direct JSON</text>
    <rect x="360" y="328" width="244" height="28" rx="4" fill="#059669"/>
    <text x="619" y="348" font-weight="700">78.188</text>
    <text x="697" y="348" fill="#4b5563">NDCG 0.881</text>

    <text x="40" y="394">LLM + tools + validator</text>
    <rect x="360" y="376" width="237" height="28" rx="4" fill="#10b981"/>
    <text x="612" y="396" font-weight="700">77.688</text>
    <text x="690" y="396" fill="#4b5563">NDCG 0.873</text>

    <text x="40" y="442">Similarity-to-best-active</text>
    <rect x="360" y="424" width="182" height="28" rx="4" fill="#f59e0b"/>
    <text x="557" y="444" font-weight="700">73.603</text>
    <text x="635" y="444" fill="#4b5563">NDCG 0.825</text>
  </g>

  <rect x="40" y="508" width="18" height="10" rx="2" fill="#2563eb"/>
  <text x="66" y="517" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#4b5563">QSAR baselines remain strongest deployable rows on this slice.</text>
  <rect x="410" y="508" width="18" height="10" rx="2" fill="#059669"/>
  <text x="436" y="517" font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#4b5563">Guarded LLM rows are useful but trail per-card QSAR.</text>
</svg>
