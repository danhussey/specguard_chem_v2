[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard-chem-v2"
version = "0.1.0"
description = "Decision-audit harness for constrained medicinal-chemistry compound prioritisation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SpecGuard-Chem Contributors" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.7",
  "pyarrow>=15.0",
  "rdkit>=2022.9.2",
  "rich>=13.7",
  "scikit-learn>=1.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]
providers = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
]

[project.scripts]
sgchem = "specguard_chem_v2.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# Line length is handled by formatting conventions, not enforced as a lint gate.
ignore = ["E501"]
